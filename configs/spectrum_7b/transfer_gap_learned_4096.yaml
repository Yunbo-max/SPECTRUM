# NEW opt-in three-state diagnostic. Original SPECTRUM study is untouched.
# Full-spectrum learned-gain generation control; ordinary SFT is unchanged.
# generated_unexecuted: qualify on the native host before the ten-round run.
seed: 43
data_seed: 42
model:
  name: /inspire/hdd/global_public/public_models/Qwen/Qwen2.5-Coder-7B-Instruct
  device: auto
  dtype: bfloat16
  attn_implementation: sdpa
  revision: null
data:
  train: data/mbpp/train.jsonl
  calibration: data/mbpp/calibration.jsonl
  validation: data/mbpp/validation.jsonl
  eval: data/mbpp/eval.jsonl
output_dir: runs/spectrum_transfer_gap_20261103/learned_7b_r10_v2
data_limits: {}
methods:
- spectral_learned
rounds: 10
checkpoint_retention: latest
generation:
  train_samples: 16
  eval_samples: 64
  batch_size: 16
  max_new_tokens: 4096
  max_prompt_tokens: 2048
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  task_batch_size: 16
  sequence_batch_size: 128
calibration:
  max_examples: 50
  max_length: 1536
  span_mode: completion
  layers: null
  reestimate_each_round: true
  gain_learning:
    guard_examples: 10
    probe_examples: 8
    probe_max_new_tokens: 128
    max_steps: 8
    learning_rate: 0.1
    min_gain: 0.1
    kl_budget: 0.02
    max_backtracks: 8
    backtrack_factor: 0.5
    min_improvement: 1.0e-6
    guard_tolerance: 0.0
    degeneracy_rtol: 1.0e-7
    degeneracy_atol: 1.0e-12
    kl_chunk_tokens: 32
train:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 16
  max_length: 6144
  require_full_completion_targets: true
  learning_rate: 1.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.05
  gradient_checkpointing: true
  loss_scope: all
evaluation:
  backend: local
  allow_unsafe_local: true
  docker_image: python:3.11-slim
  code_extraction: first_fence
  workers: 8
  timeout: 5
  ks:
  - 1
  - 4
  - 8
  - 16
  - 32
  - 64
  correct_budget: 16
  correct_budgets:
  - 4
  - 8
  - 16
  - 32
  - 64
  correctness_margin: 0.01
  bootstrap_samples: 2000
diagnostics:
  evaluate_generation_policy: false
  eval_task_limit: 128
  eval_samples: 16
  transfer_gap:
    enabled: true
    rounds: [1, 5, 8, 10]
    samples: 64
    validation_task_count: 30
    batch_size: 1
    task_batch_size: 1
    sequence_batch_size: 1
    max_prompt_tokens: 2048
    max_new_tokens: 4096
    reference_nll_each_round: true
