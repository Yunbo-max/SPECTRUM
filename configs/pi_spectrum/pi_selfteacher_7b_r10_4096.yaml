# Opt-in PI-SPECTRUM: SAME Qwen 7B is self-teacher and student.
# No data.calibration, reference answers, verifier or execution feedback in fitting.
# Newly authored protocol: GPU training and benchmark NOT EXECUTED.
seed: 43
data_seed: 42
model:
  name: /inspire/hdd/global_public/public_models/Qwen/Qwen2.5-Coder-7B-Instruct
  device: auto
  dtype: bfloat16
  attn_implementation: sdpa
data:
  train: data/mbpp/train.jsonl
  validation: data/mbpp/validation.jsonl
  eval: data/mbpp/eval.jsonl
output_dir: runs/pi_spectrum/selfteacher_7b_r10_4096
methods:
  - spectral_pi
rounds: 10
checkpoint_retention: all
pi_spectrum:
  fit_examples: 12
  guard_examples: 6
  probe_examples: 6
  plan_max_new_tokens: 96
  rollout_max_new_tokens: 64
  max_length: 2048
  plan_temperature: 0.8
  rollout_temperature: 1.0
  top_p: 0.95
  top_k: 0
  layers: null
  gain_learning:
    max_steps: 8
    learning_rate: 0.1
    min_gain: 0.1
    kl_budget: 0.02
    max_backtracks: 8
    backtrack_factor: 0.5
    min_improvement: 0.000001
    guard_tolerance: 0.0
    degeneracy_rtol: 0.0000001
    degeneracy_atol: 0.000000000001
    kl_chunk_tokens: 32
generation:
  train_samples: 16
  eval_samples: 64
  batch_size: 16
  max_new_tokens: 4096
  max_prompt_tokens: 2048
  temperature: 0.8
  top_p: 0.95
  top_k: 0
  task_batch_size: 16
  sequence_batch_size: 128
train:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 16
  max_length: 6144
  require_full_completion_targets: true
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.05
  gradient_checkpointing: true
  loss_scope: all
evaluation:
  backend: docker
  docker_image: python:3.11-slim
  code_extraction: first_fence
  workers: 8
  timeout: 5
  ks: [1, 4, 8, 16, 32, 64]
  correct_budget: 16
  correct_budgets: [4, 8, 16, 32, 64]
  bootstrap_samples: 2000
diagnostics:
  evaluate_generation_policy: false
