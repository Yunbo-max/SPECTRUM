name: Rebuttal CPU regression
on:
  push:
    branches: [research/iclr-rebuttal-stability-20261103]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuttal-cpu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source and pinned integration input
        run: |
          mkdir -p ci_artifacts
          git rev-parse HEAD > ci_artifacts/commit.txt
          git archive --format=tar.gz HEAD > ci_artifacts/source.tar.gz
          git fetch --depth=1 origin da70329c3d1cb07bbd3380d563e2cc600541a8dc
          git archive --format=tar.gz da70329c3d1cb07bbd3380d563e2cc600541a8dc > ci_artifacts/transfer-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rebuttal-source-${{ github.sha }}
          path: ci_artifacts/
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU test environment
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,analysis,evalplus]'
          python -m pip freeze > ci_artifacts/environment.txt
      - name: Run full repository test suite (no GPU, model downloads, or benchmark)
        run: python -m pytest -q --junitxml=ci_artifacts/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuttal-cpu-${{ github.sha }}
          path: ci_artifacts/
          retention-days: 14
