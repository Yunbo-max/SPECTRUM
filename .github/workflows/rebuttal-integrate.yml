name: Validate and publish rebuttal integration
on:
  push:
    branches: [research/iclr-rebuttal-stability-20261103]
    paths: [.rebuttal-delivery/**, .github/workflows/rebuttal-integrate.yml]
permissions:
  contents: write
jobs:
  validated-integration:
    if: github.ref == 'refs/heads/research/iclr-rebuttal-stability-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified source integration
        run: |
          git fetch --depth=1 origin da70329c3d1cb07bbd3380d563e2cc600541a8dc
          python .rebuttal-delivery/integrate.py
          git restore --worktree .github/workflows/rebuttal-cpu.yml
          git rm -r .rebuttal-delivery
          git add src/improving/pipeline.py src/improving/transfer_diagnostics.py configs/spectrum_7b/transfer_gap_learned_4096.yaml .gitignore README.md AGENTS.md
          mkdir -p /tmp/rebuttal-validation
          git write-tree > /tmp/rebuttal-validation/tested-tree.txt
          git archive --format=tar.gz "$(cat /tmp/rebuttal-validation/tested-tree.txt)" > /tmp/rebuttal-validation/source.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU verification dependencies
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train,test,analysis,evalplus]'
          python -m pip freeze > /tmp/rebuttal-validation/environment.txt
      - name: Full regression suite (no GPU/model download/benchmark)
        run: python -m pytest -q --junitxml=/tmp/rebuttal-validation/pytest.xml
      - name: Publish only the tested source with a fast-forward push
        run: |
          test "$(git write-tree)" = "$(cat /tmp/rebuttal-validation/tested-tree.txt)"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: integrate matched rebuttal diagnostics and all-arm resume guards'
          git rev-parse HEAD > /tmp/rebuttal-validation/commit.txt
          git push origin HEAD:refs/heads/research/iclr-rebuttal-stability-20261103
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuttal-integration-validation
          path: /tmp/rebuttal-validation/
          retention-days: 14
